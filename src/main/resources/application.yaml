spring:
  application:
    name: vidoo-api

  datasource:
    url: jdbc:postgresql://localhost:5432/vidoo_db
    username: ${DB_USERNAME:vidoo_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true