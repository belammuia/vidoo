
spring:
  application:
    name: vidoo-api

  datasource:
    url: jdbc:postgresql://localhost:5432/vidoo_db
    username: ${DB_USERNAME:vidoo_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    jwt:
      secret: ${JWT_SECRET}
      expiration: 900000

logging:
  level:
    org.springframework.security: TRACE
